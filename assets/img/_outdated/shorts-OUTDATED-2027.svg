<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-labelledby="title desc">
  <title id="title">No-Gi shorts length, 2027</title>
  <desc id="desc">Shorts must not be longer than the knee. The hem may be no more than 15 cm above the middle of the knee. In kids divisions, shorts must cover at least halfway down the thigh.</desc>
  <rect width="860" height="500" fill="#f4f6f8"/>
  <text x="28" y="34" font-family="Roboto Condensed, Arial Narrow, sans-serif" font-size="20" font-weight="700" fill="#004581">NO-GI SHORTS · 2027</text>

  <!-- Side view -->
  <g transform="translate(70,58)">
    <circle cx="90" cy="36" r="22" fill="#9aa0a6"/>
    <!-- neck / shoulders / rash guard -->
    <path d="M62 58 c8-10 48-10 56 0 v78 h-56 z" fill="#d0d4d8"/>
    <rect x="58" y="132" width="64" height="16" rx="2" fill="#3f4348"/>
    <!-- shorts: two tapered legs ending at the knee (y=248) -->
    <path d="M56 146 h68
             l8 102 h-36 l-6-86 -6 86 h-36 z" fill="#5a5f64"/>
    <!-- lower legs -->
    <path d="M60 248 l-6 130 h22 l8-130 z" fill="#9aa0a6"/>
    <path d="M114 248 l6 130 h-22 l-8-130 z" fill="#9aa0a6"/>
    <ellipse cx="65" cy="382" rx="18" ry="7" fill="#7e848a"/>
    <ellipse cx="125" cy="382" rx="18" ry="7" fill="#7e848a"/>

    <!-- dimension lines -->
    <g stroke="#004581" stroke-width="1.5" fill="none">
      <!-- kids mid-thigh ~ y=176 -->
      <line x1="150" y1="176" x2="268" y2="176" stroke-dasharray="4 3"/>
      <!-- highest hem 15cm above mid-knee ~ y=204 -->
      <line x1="150" y1="204" x2="268" y2="204"/>
      <!-- knee / max length y=248 -->
      <line x1="150" y1="248" x2="268" y2="248"/>
      <!-- vertical 15cm bracket -->
      <line x1="258" y1="204" x2="258" y2="248"/>
    </g>
    <g font-family="Roboto Condensed, Arial Narrow, sans-serif" fill="#0b2a53">
      <text x="278" y="172" font-size="13" font-weight="700" fill="#004581">Kids: at least halfway down the thigh</text>
      <text x="278" y="200" font-size="13" font-weight="700">Highest hem</text>
      <text x="278" y="216" font-size="12">15 cm above mid-knee</text>
      <text x="278" y="248" font-size="13" font-weight="700">Knee — maximum length</text>
      <text x="278" y="264" font-size="12">shorts must not go past the knee</text>
    </g>
    <text x="62" y="410" font-family="Open Sans, Arial, sans-serif" font-size="11" fill="#707072">Side view · examples only</text>
  </g>

  <!-- Front view -->
  <g transform="translate(640,70)">
    <circle cx="55" cy="28" r="18" fill="#9aa0a6"/>
    <path d="M30 48 c7-8 43-8 50 0 v66 h-50 z" fill="#d0d4d8"/>
    <rect x="28" y="110" width="54" height="14" rx="2" fill="#3f4348"/>
    <path d="M26 122 h58 l7 90 h-30 l-6-76 -6 76 h-30 z" fill="#5a5f64"/>
    <path d="M30 212 l-4 118 h18 l6-118 z" fill="#9aa0a6"/>
    <path d="M80 212 l4 118 h-18 l-6-118 z" fill="#9aa0a6"/>
    <ellipse cx="35" cy="334" rx="15" ry="6" fill="#7e848a"/>
    <ellipse cx="85" cy="334" rx="15" ry="6" fill="#7e848a"/>
    <line x1="12" y1="212" x2="98" y2="212" stroke="#004581" stroke-width="1.4"/>
    <text x="28" y="358" font-family="Open Sans, Arial, sans-serif" font-size="11" fill="#707072">Front view</text>
  </g>
</svg>
